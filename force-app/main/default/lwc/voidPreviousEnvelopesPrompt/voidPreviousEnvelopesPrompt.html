<template>
    <template if:true={showModal}>
        <section
            role="dialog"
            tabindex="-1"
            aria-modal="true"
            aria-labelledby="void-previous-envelopes-heading"
            class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <button
                    class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                    title="Close"
                    onclick={handleKeep}
                    disabled={isVoiding}>
                    <lightning-icon
                        icon-name="utility:close"
                        alternative-text="Close"
                        size="small">
                    </lightning-icon>
                    <span class="slds-assistive-text">Close</span>
                </button>
                <div class="slds-modal__header">
                    <h1
                        id="void-previous-envelopes-heading"
                        class="slds-modal__title slds-hyphenate">
                        Void previous envelopes?
                    </h1>
                </div>
                <div class="slds-modal__content slds-p-around_medium">
                    <p>{modalMessage}</p>
                    <template if:true={newestSubject}>
                        <p class="slds-m-top_small slds-text-body_small slds-text-color_weak">
                            Latest envelope: {newestSubject}
                        </p>
                    </template>
                </div>
                <div class="slds-modal__footer">
                    <lightning-button
                        variant="neutral"
                        label="Keep previous envelopes"
                        onclick={handleKeep}
                        disabled={isVoiding}>
                    </lightning-button>
                    <lightning-button
                        variant="brand"
                        label={voidButtonLabel}
                        onclick={handleVoid}
                        disabled={isVoiding}
                        class="slds-m-left_x-small">
                    </lightning-button>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
        <template if:true={isVoiding}>
            <lightning-spinner alternative-text="Voiding previous envelopes" size="medium">
            </lightning-spinner>
        </template>
    </template>
</template>
