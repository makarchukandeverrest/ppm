<template>
    <div class="slds-grid slds-wrap slds-gutters slds-p-bottom_small slds-border_bottom">
        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
            <div class="slds-grid slds-grid_vertical-align-center">
                <h2 class="slds-text-heading_small slds-m-right_small">Activity</h2>
                <span class="slds-badge slds-badge_lightest">{countLabel}</span>
            </div>
        </div>
        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
            <div class="slds-grid slds-grid_align-end slds-wrap slds-grid_vertical-align-end">
                <lightning-button-group>
                    <lightning-button-icon
                        icon-name="utility:add"
                        alternative-text="New Task"
                        title="New Task"
                        onclick={handleNewTask}>
                    </lightning-button-icon>
                    <lightning-button-icon
                        icon-name="utility:event"
                        alternative-text="New Event"
                        title="New Event"
                        onclick={handleNewEvent}>
                    </lightning-button-icon>
                    <lightning-button-icon
                        icon-name="utility:email"
                        alternative-text="New Email"
                        title="New Email"
                        onclick={handleNewEmail}>
                    </lightning-button-icon>
                    <lightning-button-icon
                        icon-name="utility:chat"
                        alternative-text="New Post"
                        title="New Post"
                        onclick={handleNewPost}>
                    </lightning-button-icon>
                </lightning-button-group>
                <lightning-button-icon
                    class="slds-m-left_xx-small"
                    icon-name="utility:refresh"
                    alternative-text="Refresh"
                    title="Refresh"
                    onclick={handleRefresh}>
                </lightning-button-icon>
                <lightning-button-icon
                    class="slds-m-left_xx-small"
                    icon-name={sortIcon}
                    alternative-text={sortLabel}
                    title={sortLabel}
                    onclick={handleSortToggle}>
                </lightning-button-icon>
            </div>
        </div>
    </div>
</template>
