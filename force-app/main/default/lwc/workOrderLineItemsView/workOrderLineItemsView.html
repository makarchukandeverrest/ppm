<template>
  <div>
  <lightning-card title="WORK ORDER" icon-name="standard:billing">
    <div class="info-section">
      <table class="slds-table slds-table_cell-buffer">
        <tbody>
          <tr>
            <td colspan="2" class="estimate-header" rowspan="5">
              <strong
                >PREMIER POOL MANAGEMENT, INC.<br />12339 Carroll Ave., Suite
                B<br />Rockville, MD 20852</strong
              >
            </td>
          </tr>
          <tr>
            <td class="estimate-label">Start Date</td>
            <td class="estimate-value">{workOrderDetails.startDate}</td>
          </tr>
          <tr>
            <td colspan="4" class="spacer"></td>
          </tr>
          <tr>
            <td class="customer-info" colspan="1">
              <strong>Customer Info</strong><br />
              {workOrderDetails.accountName}<br />
              {workOrderDetails.billingStreet}<br />
              {workOrderDetails.billingCity}, {workOrderDetails.billingState}
              {workOrderDetails.billingPostalCode}
            </td>
            <td colspan="3" class="estimate-header"></td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="spacer"></div>
    <div class="line-items-section">
      <table class="slds-table slds-table_cell-buffer">
        <thead class="fixed-header">
          <tr class="slds-text-title_caps">
            <!--<th scope="col" class="centered-header">To Delete?</th>-->
            <th scope="col" class="item-column">Item</th>
            <th scope="col" class="description-column">Description</th>
            <th scope="col" class="centered-header">Quantity</th>
            <th scope="col" class="centered-header">Service Team Member</th>
            <!-- <th scope="col" class="centered-header">Unit Cost</th>
            <th scope="col" class="centered-header">Total</th> -->
            <!--<th scope="col" class="centered-header">Tax</th>-->
          </tr>
        </thead>
        <tbody class="scrollable-body">
          <template for:each={lineItemsForDisplay} for:item="item">
            <tr key={item.Id}>
              <!--<td class="slds-cell-wrap centered-cell">
                <lightning-input
                  type="checkbox"
                  data-id={item.Id}
                  onchange={handleCheckboxChange}
                ></lightning-input>
              </td>-->
              <td
                class="slds-cell-wrap item-column"
                data-id={item.Id}
                data-field="Name"
              >
                <template if:true={item.isEditing}>
                  <lightning-input
                    type="text"
                    value={item.itemNameDisplay}
                    onchange={handleDescriptionChange}
                    data-id={item.Id}
                    data-field="Name"
                    class="slds-input_height-auto"
                  >
                  </lightning-input>
                </template>
                <template if:false={item.isEditing}>
                  {item.itemNameDisplay}
                </template>
              </td>
              <td
                class="slds-cell-wrap description-column"
                data-id={item.Id}
                data-field="Description__c"
              >
                <template if:true={item.isEditing}>
                  <lightning-input
                    type="text"
                    value={item.Description__c}
                    onchange={handleDescriptionChange}
                    data-id={item.Id}
                    data-field="Description__c"
                    class="slds-input_height-auto"
                  >
                  </lightning-input>
                </template>
                <template if:false={item.isEditing}>
                  {item.Description__c}
                </template>
              </td>
              <td
                class="slds-cell-wrap centered-cell"
                data-id={item.Id}
                data-field="Quantity__c"
              >
                <template if:true={item.isEditing}>
                  <lightning-input
                    type="number"
                    value={item.Quantity__c}
                    onchange={handleQuantityChange}
                    data-id={item.Id}
                    data-field="Quantity__c"
                    class="slds-input_height-auto"
                  >
                  </lightning-input>
                </template>
                <template if:false={item.isEditing}>
                  {item.Quantity__c}
                </template>
              </td>
              <td class="slds-cell-wrap centered-cell">
                <template if:false={item.isEditingAssignment}>
                  <div
                    class="slds-grid slds-grid_vertical-align-center slds-gutters_x-small"
                  >
                    <div class="slds-col">
                      {item.assignmentDisplayLabel}
                    </div>
                    <div class="slds-col slds-grow-none">
                      <lightning-button-icon
                        icon-name="utility:edit"
                        alternative-text="Edit Service Team Member"
                        variant="border-filled"
                        size="small"
                        data-id={item.Id}
                        onclick={handleBeginEditAssignment}
                      ></lightning-button-icon>
                    </div>
                  </div>
                </template>
                <template if:true={item.isEditingAssignment}>
                  <div
                    class="slds-grid slds-grid_vertical-align-center slds-gutters_x-small"
                  >
                    <div class="slds-col slds-grow">
                      <lightning-record-picker
                        label="Service Team Member"
                        variant="label-hidden"
                        object-api-name="Service_Team_Member__c"
                        placeholder="Search Service Team Members..."
                        matching-info={serviceTeamMemberMatchingInfo}
                        display-info={serviceTeamMemberDisplayInfo}
                        value={item.draftServiceTeamMemberPickerValue}
                        data-id={item.Id}
                        onchange={handleServiceTeamMemberDraftChange}
                      ></lightning-record-picker>
                    </div>
                    <template if:true={canCreateServiceTeamMember}>
                      <div class="slds-col slds-grow-none">
                        <lightning-button-icon
                          icon-name="utility:add"
                          alternative-text="New Service Team Member"
                          title="New Service Team Member"
                          variant="border-filled"
                          size="small"
                          data-id={item.Id}
                          onclick={handleOpenCreateMemberModal}
                        ></lightning-button-icon>
                      </div>
                    </template>
                  </div>
                </template>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
    <div slot="footer" class="slds-p-around_small">
      <lightning-button
        variant="neutral"
        label="Cancel"
        onclick={handleCancelAssignments}
        disabled={isCancelDisabled}
        class="slds-m-right_x-small"
      ></lightning-button>
      <lightning-button
        variant="brand"
        label="Save"
        onclick={handleSaveAssignments}
        disabled={isSaveDisabled}
      ></lightning-button>
    </div>
  </lightning-card>
  <template if:true={showCreateMemberModal}>
    <section
      role="dialog"
      tabindex="-1"
      aria-modal="true"
      aria-labelledby="create-member-heading"
      class="slds-modal slds-fade-in-open create-member-modal"
    >
      <div class="slds-modal__container">
        <header class="slds-modal__header">
          <lightning-button-icon
            icon-name="utility:close"
            alternative-text="Close"
            title="Close"
            variant="bare-inverse"
            class="slds-modal__close"
            onclick={handleCloseCreateMemberModal}
          ></lightning-button-icon>
          <h2 id="create-member-heading" class="slds-text-heading_medium">
            New Service Team Member
          </h2>
        </header>
        <div class="slds-modal__content slds-p-around_medium">
          <lightning-record-edit-form
            object-api-name="Service_Team_Member__c"
            onsuccess={handleCreateMemberSuccess}
            onerror={handleCreateMemberError}
          >
            <lightning-messages></lightning-messages>
            <lightning-input-field field-name="Name"></lightning-input-field>
            <lightning-input-field field-name="Email__c"></lightning-input-field>
            <div class="slds-m-top_medium slds-text-align_right">
              <lightning-button
                label="Cancel"
                onclick={handleCloseCreateMemberModal}
                class="slds-m-right_x-small"
              ></lightning-button>
              <lightning-button
                variant="brand"
                type="submit"
                label="Save"
              ></lightning-button>
            </div>
          </lightning-record-edit-form>
        </div>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open create-member-backdrop"></div>
  </template>
  </div>
</template>
