<template>
  <template if:true={hasParts}>
    <template for:each={parts} for:item="part">
      <template if:true={part.isText}>
        <p key={part.key} class="slds-text-body_small slds-text-color_default">
          <lightning-formatted-rich-text value={part.text} disable-linkify>
          </lightning-formatted-rich-text>
        </p>
      </template>
      <template if:true={part.isFile}>
        <button
          key={part.key}
          type="button"
          class="slds-button activity-file"
          data-id={part.contentDocumentId}
          onclick={handleImageClick}
          title="Open file preview"
        >
          <lightning-icon
            icon-name={part.fileIcon}
            size="small"
            alternative-text={part.fileName}
            class="slds-m-right_x-small"
          >
          </lightning-icon>
          <span class="activity-file-name">{part.fileName}</span>
        </button>
      </template>
      <template if:true={part.isImage}>
        <template if:true={part.isClickable}>
          <img
            key={part.key}
            src={part.imageUrl}
            alt={part.altText}
            title="Open file preview"
            class="activity-image"
            data-id={part.contentDocumentId}
            onclick={handleImageClick}
            onkeydown={handleImageKeydown}
            role="button"
            tabindex="0"
          />
        </template>
        <template if:false={part.isClickable}>
          <img
            key={part.key}
            src={part.imageUrl}
            alt={part.altText}
            class="activity-image"
          />
        </template>
      </template>
    </template>
  </template>
  <template if:true={showFallback}>
    <p class="slds-text-body_small slds-text-color_default">
      <lightning-formatted-rich-text value={fallbackText} disable-linkify>
      </lightning-formatted-rich-text>
    </p>
  </template>
</template>
