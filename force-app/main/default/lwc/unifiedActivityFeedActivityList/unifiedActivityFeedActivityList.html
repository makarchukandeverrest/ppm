<template>
  <!-- Loading -->
  <template if:true={isLoading}>
    <div class="slds-align_absolute-center slds-p-around_medium">
      <lightning-spinner
        alternative-text="Loading activities"
        size="small"
      ></lightning-spinner>
    </div>
  </template>

  <!-- Empty state -->
  <template if:true={isEmpty}>
    <div
      class="slds-illustration slds-illustration_small slds-text-align_center slds-p-around_medium"
    >
      <div class="slds-text-color_weak slds-text-heading_small">
        {emptyMessage}
      </div>
    </div>
  </template>

  <!-- Activity list -->
  <template if:true={hasActivities}>
    <ul class="slds-timeline">
      <template for:each={displayActivities} for:item="item">
        <li key={item.id} class={item.timelineClass}>
          <div class="slds-media">
            <div class="slds-media__figure">
              <lightning-icon
                icon-name={item.iconName}
                size="small"
                alternative-text={item.formattedType}
              >
              </lightning-icon>
            </div>
            <div class="slds-media__body">
              <div class="slds-grid slds-grid_align-spread">
                <div
                  class="slds-timeline__actions slds-timeline__actions_inline"
                >
                  <button
                    class="slds-button slds-button_reset slds-timeline__trigger"
                    data-id={item.id}
                    data-type={item.type}
                    onclick={handleItemClick}
                  >
                    <span class="slds-assistive-text"
                      >{item.formattedType}</span
                    >
                    <div class="slds-media slds-media_center">
                      <div class="slds-media__body">
                        <p class="slds-timeline__entity slds-truncate">
                          <strong>{item.title}</strong>
                        </p>
                        <p class="slds-text-body_small slds-text-color_weak">
                          {item.formattedType}
                          <template if:true={item.showSourceLabel}>
                            • {item.sourceLabel}
                          </template>
                          <template if:true={item.hasAttachments}>
                            • {item.attachmentLabel}
                          </template>
                          • {item.createdByName} • {item.displayDate}
                        </p>
                      </div>
                    </div>
                  </button>
                  <template if:true={item.showOpenNote}>
                    <lightning-button
                      class="slds-m-left_small"
                      variant="base"
                      label="Open Note"
                      title="Open Note"
                      data-id={item.id}
                      onclick={handleItemClick}
                    >
                    </lightning-button>
                  </template>
                  <div class="slds-timeline__date">
                    <p class="slds-text-body_small slds-text-color_weak">
                      {item.displayDate}
                    </p>
                  </div>
                </div>
              </div>

              <template if:true={item.hasDisplayBody}>
                <template if:true={item.isCollapsibleBody}>
                  <div class="slds-m-top_x-small slds-m-left_xx-large">
                    <button
                      class="slds-button slds-button_reset email-body-toggle"
                      type="button"
                      data-id={item.id}
                      aria-expanded={item.expandAria}
                      onclick={handleToggleBody}
                    >
                      <lightning-icon
                        icon-name={item.expandIcon}
                        size="xx-small"
                        alternative-text={item.toggleLabel}
                        class="slds-m-right_xx-small"
                      >
                      </lightning-icon>
                      <span>{item.toggleLabel}</span>
                    </button>
                    <template if:true={item.showPreview}>
                      <p
                        class="slds-text-body_small slds-text-color_weak email-body-preview"
                      >
                        {item.bodyPreview}
                      </p>
                    </template>
                    <template if:true={item.showCollapsedStatus}>
                      <p class="slds-m-top_xx-small">
                        <span class="slds-badge slds-badge_lightest"
                          >{item.status}</span
                        >
                      </p>
                    </template>
                  </div>
                </template>
                <template if:true={item.showFullBody}>
                  <div
                    class="slds-box slds-theme_shade slds-m-top_x-small slds-m-left_xx-large activity-description"
                  >
                    <c-unified-activity-content-parts
                      parts={item.contentParts}
                      fallback-text={item.description}
                      onimageclick={handleImageClick}
                    >
                    </c-unified-activity-content-parts>
                    <template if:true={item.status}>
                      <p class="slds-m-top_x-small">
                        <span class="slds-badge slds-badge_lightest"
                          >{item.status}</span
                        >
                      </p>
                    </template>
                  </div>
                </template>
              </template>

              <template if:true={item.showCommentsToggle}>
                <div class="slds-m-top_x-small slds-m-left_xx-large">
                  <button
                    class="slds-button slds-button_reset email-body-toggle"
                    type="button"
                    data-id={item.id}
                    aria-expanded={item.commentsExpandAria}
                    onclick={handleToggleComments}
                  >
                    <lightning-icon
                      icon-name={item.commentsExpandIcon}
                      size="xx-small"
                      alternative-text={item.commentsToggleLabel}
                      class="slds-m-right_xx-small"
                    >
                    </lightning-icon>
                    <span>{item.commentsToggleLabel}</span>
                  </button>
                  <template if:true={item.showComments}>
                    <ul
                      class="slds-m-top_x-small slds-has-dividers_around-space"
                    >
                      <template for:each={item.comments} for:item="comment">
                        <li
                          key={comment.key}
                          class="slds-box slds-theme_shade slds-m-top_x-small"
                        >
                          <p class="slds-text-body_small slds-text-color_weak">
                            <strong>{comment.createdByName}</strong>
                            • {comment.displayDate}
                          </p>
                          <c-unified-activity-content-parts
                            parts={comment.contentParts}
                            fallback-text={comment.body}
                            onimageclick={handleImageClick}
                          >
                          </c-unified-activity-content-parts>
                        </li>
                      </template>
                    </ul>
                  </template>
                </div>
              </template>
            </div>
          </div>
        </li>
      </template>
    </ul>

    <template if:true={showLoadMore}>
      <div
        class="slds-align_absolute-center slds-m-top_medium load-more-container"
      >
        <lightning-button
          label="Show more activities"
          variant="base"
          onclick={handleLoadMore}
          disabled={isLoadingMore}
        >
        </lightning-button>
      </div>
    </template>

    <template if:true={isLoadingMore}>
      <div class="slds-align_absolute-center slds-p-around_small">
        <lightning-spinner
          alternative-text="Loading more activities"
          size="small"
        ></lightning-spinner>
      </div>
    </template>
  </template>
</template>
