<template>
    <lightning-card title={cardTitle} icon-name="standard:account">
        <div class="slds-p-around_medium">
            <!-- Search Section -->
            <div class="slds-m-bottom_medium">
                <template if:true={hasLoadError}>
                    <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_small" role="alert">
                        <span class="slds-assistive-text">Error</span>
                        <h2>{loadErrorMessage}</h2>
                    </div>
                </template>
                <div class="slds-grid slds-wrap slds-gutters">
                    <!-- Name/Email Search -->
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_small">
                        <lightning-input
                            label="Customer Name or Email"
                            type="search"
                            value={searchTerm}
                            onchange={handleSearch}
                            placeholder="Search by customer name or email...">
                        </lightning-input>
                    </div>
                    
                    <!-- Contract Periods Filter -->
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_small">
                        <lightning-dual-listbox
                            name="contractPeriodFilter"
                            label="Contract Periods"
                            options={contractPeriodOptions}
                            value={selectedContractPeriods}
                            onchange={handleContractPeriodsChange}
                            size="4">
                        </lightning-dual-listbox>
                    </div>
                    
                    <!-- County Picklist -->
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_small">
                        <lightning-combobox
                            name="countyFilter"
                            label="County"
                            value={selectedCounty}
                            placeholder="Select County"
                            options={countyOptions}
                            onchange={handleCountyChange}>
                        </lightning-combobox>
                    </div>
                    
                    <!-- Regional Manager Picklist -->
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_small">
                        <lightning-combobox
                            data-name="regionalManagerFilter"
                            label="Regional Manager"
                            value={selectedRegionalManager}
                            placeholder="Select Regional Manager"
                            options={regionalManagerOptions}
                            onchange={handleRegionalManagerChange}>
                        </lightning-combobox>
                    </div>

                    <!-- Recent Contract Bid Year Filter -->
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_small">
                        <lightning-combobox
                            name="contractYearFilter"
                            label="Recent Contract Bid Year"
                            value={selectedContractYear}
                            placeholder="Select Contract Year"
                            options={contractYearOptions}
                            onchange={handleContractYearChange}>
                        </lightning-combobox>
                    </div>
                    
                    <!-- Clear Button -->
                    <div class="slds-col slds-size_1-of-1 slds-m-bottom_small">
                        <div class="clear-button-container">
                            <lightning-button
                                label="Clear All Filters"
                                onclick={handleClearSearch}
                                variant="neutral"
                                class="slds-m-top_x-small">
                            </lightning-button>
                        </div>
                    </div>
                </div>
                
                <div class="slds-text-body_small slds-text-color_weak slds-m-top_small">
                    <template if:true={hasActiveFilters}>
                        <span class="slds-m-left_x-small">(Filters applied)</span>
                    </template>
                </div>
            </div>

            <div class="map-layout">
                <!-- Map Column -->
                <div class="map-layout__map">
                    <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_small map-header">
                        <h3 class="slds-text-heading_small">Customer Locations Map</h3>
                        <div class="map-legend slds-text-body_small">
                            <span class="legend-item">
                                <span class="legend-dot legend-dot_won"></span>
                                Closed - WON
                            </span>
                            <span class="legend-item">
                                <span class="legend-dot legend-dot_lost"></span>
                                Closed - LOST
                            </span>
                            <span class="legend-item">
                                <span class="legend-dot legend-dot_no-bid"></span>
                                No Recent Bid
                            </span>
                            <span class="legend-item">
                                <span class="legend-dot legend-dot_other"></span>
                                Other Stage
                            </span>
                            <span class="legend-item">
                                <span class="legend-dot legend-dot_multi"></span>
                                Multiple Customers
                            </span>
                        </div>
                    </div>
                    <template if:true={hasFilteredMarkers}>
                        <div class="map-container">
                            <lightning-map
                                map-markers={filteredMapMarkers}
                                markers-title="Customers"
                                onmarkerselect={handleMarkerSelect}
                                selected-marker-value={selectedMarkerValue}
                                list-view="hidden"
                                zoom-level={zoomLevel}
                                center={center}
                                options={mapOptions}>
                            </lightning-map>
                        </div>
                    </template>
                    <template if:false={hasFilteredMarkers}>
                        <div class="slds-text-align_center slds-p-vertical_medium">
                            <template if:true={hasActiveFilters}>
                                <p class="slds-text-body_regular">No customer locations match your search criteria.</p>
                                <p class="slds-text-body_regular slds-m-top_x-small">Try adjusting your filters or clear them to see all customers.</p>
                            </template>
                            <template if:false={hasActiveFilters}>
                                <p class="slds-text-body_regular">No customer locations available to display on the map.</p>
                                <p class="slds-text-body_regular slds-m-top_x-small">Ensure customers have valid billing address coordinates.</p>
                            </template>
                        </div>
                    </template>
                </div>

                <!-- Details Column -->
                <template if:true={hasAnySelection}>
                <div data-id="detailsAnchor" class="map-layout__details">
                    <div class="details-actions slds-m-bottom_small">
                        <lightning-button
                            label="Clear Selection"
                            variant="neutral"
                            onclick={clearSelection}>
                        </lightning-button>
                    </div>
                    <template if:true={hasSelectedLocationGroup}>
                        <div class="customer-detail slds-box slds-theme_default">
                            <h3 class="slds-text-heading_small slds-m-bottom_x-small">Shared Address</h3>
                            <p class="slds-text-body_regular slds-m-bottom_x-small">
                                <strong>Address:</strong> {selectedLocationAddress}
                            </p>
                            <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">{selectedLocationCountLabel}</p>

                            <ul class="location-customer-list">
                                <template for:each={customersAtSelectedLocation} for:item="customer">
                                    <li key={customer.id} class="location-customer-list__item">
                                        <div
                                            class="location-customer-list__button"
                                            data-id={customer.id}
                                            onclick={handleLocationCustomerSelect}
                                            role="button"
                                            tabindex="0">
                                            <lightning-button
                                                class="location-customer-list__name-link"
                                                variant="base"
                                                label={customer.name}
                                                data-id={customer.id}
                                                onclick={handleNavigateToAccountFromList}>
                                            </lightning-button>
                                            <span class={customer.statusClass}>{customer.statusLabel}</span>
                                        </div>
                                    </li>
                                </template>
                            </ul>
                        </div>
                    </template>

                    <template if:true={hasSelectedCustomer}>
                        <div class="customer-detail slds-box slds-theme_default">
                            <div class="slds-grid slds-grid_vertical-align-center slds-wrap slds-m-bottom_small">
                                <lightning-button
                                    class="selected-customer-link slds-m-right_small"
                                    variant="base"
                                    label={selectedCustomer.name}
                                    onclick={handleNavigateToSelectedCustomer}>
                                </lightning-button>
                                <span class={selectedCustomerStatusClass}>{selectedCustomerStatusLabel}</span>
                            </div>

                            <p class="slds-text-body_regular slds-m-bottom_small">
                                <strong>Address:</strong> {selectedCustomerAddress}
                            </p>

                            <dl class="detail-list slds-m-bottom_small">
                                <template if:true={selectedCustomer.managementCompanyName}>
                                    <div class="detail-list__row">
                                        <dt>Management Company</dt>
                                        <dd>
                                            <lightning-formatted-url
                                                value={selectedManagementCompanyUrl}
                                                label={selectedCustomer.managementCompanyName}
                                                target="_blank">
                                            </lightning-formatted-url>
                                        </dd>
                                    </div>
                                </template>
                                <div class="detail-list__row">
                                    <dt>Primary Contact</dt>
                                    <dd>
                                        <template if:true={selectedCustomer.primaryContactId}>
                                            <lightning-formatted-url
                                                value={selectedPrimaryContactUrl}
                                                label={selectedCustomer.primaryContactName}
                                                target="_blank">
                                            </lightning-formatted-url>
                                            <template if:true={selectedCustomer.primaryContactPhone}>
                                                <div class="slds-text-body_small slds-text-color_weak">
                                                    <lightning-formatted-phone value={selectedCustomer.primaryContactPhone}></lightning-formatted-phone>
                                                </div>
                                            </template>
                                            <template if:true={selectedCustomer.primaryContactEmail}>
                                                <div class="slds-text-body_small slds-text-color_weak">
                                                    <lightning-formatted-email value={selectedCustomer.primaryContactEmail}></lightning-formatted-email>
                                                </div>
                                            </template>
                                        </template>
                                        <template if:false={selectedCustomer.primaryContactId}>
                                            <span class="slds-text-color_weak">—</span>
                                        </template>
                                    </dd>
                                </div>
                                <template if:true={selectedCustomer.regionalManagerName}>
                                    <div class="detail-list__row">
                                        <dt>Regional Manager</dt>
                                        <dd>{selectedCustomer.regionalManagerName}</dd>
                                    </div>
                                </template>
                                <template if:true={selectedCustomer.contractBidColoredLabels}>
                                    <div class="detail-list__row">
                                        <dt>Label</dt>
                                        <dd>
                                            <lightning-formatted-rich-text
                                                value={selectedCustomer.contractBidColoredLabels}
                                            ></lightning-formatted-rich-text>
                                        </dd>
                                    </div>
                                </template>
                                <template if:true={selectedCustomer.lastActivitySubject}>
                                    <div class="detail-list__row">
                                        <dt>Last Activity</dt>
                                        <dd>
                                            {selectedCustomer.lastActivityType} — {selectedCustomer.lastActivitySubject}
                                            <template if:true={selectedCustomer.lastActivityDateTime}>
                                                <span class="slds-m-left_x-small">
                                                    (<lightning-formatted-date-time value={selectedCustomer.lastActivityDateTime}></lightning-formatted-date-time>)
                                                </span>
                                            </template>
                                        </dd>
                                    </div>
                                </template>
                            </dl>

                            <div class="slds-text-body_small slds-m-bottom_small">
                                <lightning-formatted-url
                                    value={selectedCustomerUrl}
                                    label="Open Account"
                                    target="_blank">
                                </lightning-formatted-url>
                                <template if:true={selectedContractBidUrl}>
                                    <span class="slds-m-horizontal_x-small">|</span>
                                    <lightning-formatted-url
                                        value={selectedContractBidUrl}
                                        label="Open Contract Bid"
                                        target="_blank">
                                    </lightning-formatted-url>
                                </template>
                            </div>

                            <template if:true={hasSelectedRecentBid}>
                                <h4 class="slds-text-heading_small slds-m-bottom_x-small">Recent Contract Bid</h4>
                                <dl class="detail-list">
                                    <div class="detail-list__row">
                                        <dt>Name</dt>
                                        <dd>{selectedRecentBid.Name}</dd>
                                    </div>
                                    <template if:true={selectedRecentBid.Stage__c}>
                                        <div class="detail-list__row">
                                            <dt>Stage</dt>
                                            <dd>{selectedRecentBid.Stage__c}</dd>
                                        </div>
                                    </template>
                                    <template if:true={selectedRecentBid.Contract_Year__c}>
                                        <div class="detail-list__row">
                                            <dt>Contract Year</dt>
                                            <dd>{selectedRecentBid.Contract_Year__c}</dd>
                                        </div>
                                    </template>
                                    <template if:true={selectedRecentBid.Contract_Start_Date__c}>
                                        <div class="detail-list__row">
                                            <dt>Start Date</dt>
                                            <dd>
                                                <lightning-formatted-date-time
                                                    value={selectedRecentBid.Contract_Start_Date__c}
                                                    year="numeric"
                                                    month="short"
                                                    day="2-digit">
                                                </lightning-formatted-date-time>
                                            </dd>
                                        </div>
                                    </template>
                                    <template if:true={selectedRecentBid.Contract_End_Date__c}>
                                        <div class="detail-list__row">
                                            <dt>End Date</dt>
                                            <dd>
                                                <lightning-formatted-date-time
                                                    value={selectedRecentBid.Contract_End_Date__c}
                                                    year="numeric"
                                                    month="short"
                                                    day="2-digit">
                                                </lightning-formatted-date-time>
                                            </dd>
                                        </div>
                                    </template>
                                    <template if:true={selectedRecentBid.Due_Date__c}>
                                        <div class="detail-list__row">
                                            <dt>Due Date</dt>
                                            <dd>
                                                <lightning-formatted-date-time
                                                    value={selectedRecentBid.Due_Date__c}
                                                    year="numeric"
                                                    month="short"
                                                    day="2-digit">
                                                </lightning-formatted-date-time>
                                            </dd>
                                        </div>
                                    </template>
                                    <template if:true={showSelectedRecentBidTotal}>
                                        <div class="detail-list__row">
                                            <dt>Total</dt>
                                            <dd>
                                                <lightning-formatted-number
                                                    value={selectedRecentBid.Total__c}
                                                    format-style="currency"
                                                    currency-code="USD">
                                                </lightning-formatted-number>
                                            </dd>
                                        </div>
                                    </template>
                                </dl>
                            </template>
                            <template if:false={hasSelectedRecentBid}>
                                <p class="slds-text-body_regular slds-text-color_weak">No Recent Contract Bid linked.</p>
                            </template>

                            <template if:true={selectedCustomer.contractBidDescription}>
                                <div class="slds-m-top_small">
                                    <h4 class="slds-text-heading_small slds-m-bottom_x-small">Notes</h4>
                                    <p class="slds-text-body_regular">{selectedCustomer.contractBidDescription}</p>
                                </div>
                            </template>
                        </div>
                    </template>

                    <!-- hidden when nothing selected -->
                </div>
                </template>
            </div>

        </div>
    </lightning-card>
</template>
