name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm production deployment'
        required: true
        type: string

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    container: 
      image: salesforce/cli:latest-slim
    
    if: github.event.inputs.confirm == 'deploy'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Authenticate to Production
        run: |
          echo ${{ secrets.SF_PROD_SFDX_URL }} | sf org login sfdx-url -s -u

      - name: Verify Authentication
        run: |
          sf org display || exit 1

      - name: Validate Deployment (Dry Run)
        run: |
          sf project deploy start --source-dir force-app --dry-run --wait 10

      - name: Deploy to Production
        run: |
          sf project deploy start --source-dir force-app --wait 10

      - name: Run Apex Tests
        run: |
          sf apex run test --code-coverage --result-format human --wait 10

      - name: Deployment Summary
        if: always()
        run: |
          echo "## 🚀 Production Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Deployed from branch: **${{ github.ref }}**" >> $GITHUB_STEP_SUMMARY
          echo "Commit: **${{ github.sha }}**" >> $GITHUB_STEP_SUMMARY
          echo "Triggered by: **${{ github.actor }}**" >> $GITHUB_STEP_SUMMARY
          