name: Deploy to Dev Sandbox

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Salesforce CLI
        uses: salesforce-actions/setup-sfdx@v2

      - name: Authenticate to Dev Sandbox
        run: |
          echo "${{ secrets.SF_DEV_SFDX_URL }}" > /tmp/sfdx-url.txt
          sf org login sfdx-url \
            --sfdx-url-file /tmp/sfdx-url.txt \
            --alias dev \
            --set-default-username
        env:
          SF_DEV_SFDX_URL: ${{ secrets.SF_DEV_SFDX_URL }}

      - name: Deploy to Dev Sandbox
        run: |
          sf project deploy start \
            --source-dir force-app \
            --target-org dev \
            --wait 10

      - name: Run Apex Tests (Optional)
        run: |
          sf apex run test \
            --target-org dev \
            --code-coverage \
            --result-format human \
            --wait 10 || true
